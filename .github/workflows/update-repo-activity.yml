name: Update Repo Activity Graph

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/repo-activity.svg
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-activity-graph:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG
        run: python scripts/generate_repo_activity_svg.py

      - name: Commit graph update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repo-activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update repo activity graph"
          git push
